<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김현주 | 생성형 AI 교육 · AI 활용 홈페이지 제작</title>
<meta name="description" content="생성형 AI 교육부터 홈페이지 제작까지, 배움이 실질적인 결과로 이어지도록 함께합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   디자인 토큰
   ========================================================= */
:root{
  --ink:#302B27;        /* 짙은 브라운 (어두운 영역) */
  --ink-2:#3A342F;
  --ink-3:#463F39;
  --teal:#9A563A;       /* 포인트: 테라코타 (변수 이름은 기존 구조 유지) */
  --teal-lt:#E0A88E;    /* 어두운 배경 위 포인트 */
  --blue:#9A563A;
  --ivory:#FAF7F2;
  --paper:#FFFFFF;
  --charcoal:#302B27;
  --muted:#70665E;
  --line:#E8E0D5;

  --bg:var(--ivory); --bg-alt:#F3EEE6; --surface:#FFFFFF; --surface-2:#F1EBE2;
  --text:var(--charcoal); --text-muted:var(--muted); --heading:#302B27;
  --accent:#9A563A; --accent-2:#9A563A; --border:var(--line);
  --header-bg:rgba(250,247,242,.88);
  --btn-bg:#302B27; --btn-text:#fff;

  --on-dark:#F6F1EA; --on-dark-muted:#C9BFB4; --on-dark-line:rgba(255,255,255,.12);

  --sans:"Pretendard","Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:var(--sans);
  --maxw:1200px; --header-h:76px;
  --ease:cubic-bezier(.22,.7,.2,1);

  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1916; --bg-alt:#221E1A; --surface:#2A2521; --surface-2:#322C27;
    --text:#E8E1D8; --text-muted:#B5AA9F; --heading:#F6F1EA;
    --accent:#D9967A; --accent-2:#D9967A; --border:#3D3630;
    --header-bg:rgba(28,25,22,.88); --btn-bg:#F6F1EA; --btn-text:#1C1916;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1916; --bg-alt:#221E1A; --surface:#2A2521; --surface-2:#322C27;
  --text:#E8E1D8; --text-muted:#B5AA9F; --heading:#F6F1EA;
  --accent:#D9967A; --accent-2:#D9967A; --border:#3D3630;
  --header-bg:rgba(28,25,22,.88); --btn-bg:#F6F1EA; --btn-text:#1C1916;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--header-h) + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.78;word-break:keep-all;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.locked{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px;border-radius:4px}
::selection{background:var(--teal);color:#fff}
.skip{position:absolute;left:-9999px;top:0}
.skip:focus{left:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:100;background:var(--surface);padding:10px 16px;border-radius:8px}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 32px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.serif{font-family:var(--serif)}

/* ---------- 버튼 ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border-radius:999px;font-size:16px;font-weight:600;letter-spacing:-.005em;text-decoration:none;border:1px solid transparent;transition:background .3s var(--ease),color .3s,border-color .3s,transform .3s var(--ease)}
.btn .ico{width:18px;height:18px;stroke-width:2;transition:transform .3s var(--ease)}
.btn:hover .ico.go{transform:translateX(3px)}
.btn-primary{background:var(--btn-bg);color:var(--btn-text)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-line{border-color:var(--border);color:var(--heading)}
.btn-line:hover{border-color:var(--heading)}
.btn-sm{min-height:44px;padding:0 18px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
/* 어두운 배경용 */
.on-dark .btn-primary{background:#fff;color:var(--ink)}
.on-dark .btn-teal{background:var(--teal);color:#fff}
.on-dark .btn-teal:hover{background:#9A563A}
.on-dark .btn-line{border-color:rgba(255,255,255,.28);color:#fff}
.on-dark .btn-line:hover{border-color:#fff;background:rgba(255,255,255,.06)}
.link{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--heading);text-decoration:none;padding:6px 0;border-bottom:1px solid currentColor}
.link .ico{width:16px;height:16px;stroke-width:2;transition:transform .3s var(--ease)}
.link:hover .ico{transform:translateX(3px)}

/* ---------- 헤더 ---------- */
/* 메인 화면·헤더 토큰 */
:root{
  --hz-bg:#FAF7F2; --hz-text:#302B27; --hz-accent:#9A563A; --hz-sub:#70665E;
  --hz-line:rgba(48,43,39,.14); --hz-surface:#FFFFFF; --hz-surface-2:#F3EEE6;
  --hz-shadow:0 30px 60px -48px rgba(48,43,39,.35);
  --hz-btn-bg:#302B27; --hz-btn-text:#FFFFFF;
  --hz-header-bg:rgba(250,247,242,.88);
  --hz-font:"Pretendard","Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --hz-bg:#1C1916; --hz-text:#F6F1EA; --hz-accent:#D9967A; --hz-sub:#B5AA9F;
    --hz-line:rgba(246,241,234,.14); --hz-surface:#2A2521; --hz-surface-2:#241F1B;
    --hz-shadow:0 30px 60px -48px rgba(0,0,0,.7);
    --hz-btn-bg:#F6F1EA; --hz-btn-text:#1C1916;
    --hz-header-bg:rgba(28,25,22,.88);
  }
}
:root[data-theme="dark"]{
  --hz-bg:#1C1916; --hz-text:#F6F1EA; --hz-accent:#D9967A; --hz-sub:#B5AA9F;
  --hz-line:rgba(246,241,234,.14); --hz-surface:#2A2521; --hz-surface-2:#241F1B;
  --hz-shadow:0 30px 60px -48px rgba(0,0,0,.7);
  --hz-btn-bg:#F6F1EA; --hz-btn-text:#1C1916;
  --hz-header-bg:rgba(28,25,22,.88);
}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hz-header-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:background .3s}
body.at-top::before{background:var(--hz-bg);backdrop-filter:none}
.header{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .35s,box-shadow .35s;color:var(--hz-text);font-family:var(--hz-font)}
.header.scrolled{background:var(--hz-header-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--hz-line)}
/* 메뉴가 열려 있을 때는 흐림 효과를 꺼야 전체 화면 메뉴가 잘리지 않습니다 */
.header.menu-open{background:var(--hz-bg);backdrop-filter:none;-webkit-backdrop-filter:none}
.header .wrap{max-width:1200px}
.header-inner{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;gap:24px}
/* 공통 브랜드 스타일(푸터에서도 사용) */
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand-mark{width:36px;height:36px;flex:none}
.brand-name{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:-.01em;line-height:1.1}
.brand-sub{display:block;font-size:12px;opacity:.65;font-weight:400;letter-spacing:0;font-family:var(--sans);margin-top:2px}
/* 헤더 워드마크 */
.wordmark{display:flex;flex-direction:column;gap:5px;text-decoration:none;color:inherit;line-height:1;padding:6px 0}
.wordmark b{font-size:21px;font-weight:700;letter-spacing:-.04em}
.wordmark small{font-size:10.5px;font-weight:500;letter-spacing:.17em;color:var(--hz-sub)}
.wordmark b i{font-style:normal;color:var(--hz-accent)}
.nav{display:flex;align-items:center;gap:4px}
.nav a{position:relative;font-size:15px;font-weight:500;text-decoration:none;padding:10px 14px;color:inherit;opacity:.78;transition:opacity .2s;letter-spacing:-.01em}
.nav a:hover,.nav a.active{opacity:1}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:1px;background:var(--hz-accent);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.nav a:hover::after,.nav a.active::after{transform:scaleX(1)}
.nav .nav-cta{margin-left:16px;opacity:1;padding:10px 22px;border-radius:999px;border:1px solid var(--hz-text);transition:background .25s,color .25s,border-color .25s}
.nav .nav-cta::after{display:none}
.nav .nav-cta:hover{background:var(--hz-text);color:var(--hz-bg)}
.menu-btn{display:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--hz-line);align-items:center;justify-content:center;color:inherit}
.menu-btn svg{width:20px;height:20px;stroke:currentColor}
@media (max-width:1100px){
  .menu-btn{display:inline-flex}
  .nav{position:fixed;top:calc(var(--header-h) + env(safe-area-inset-top,0px));left:0;right:0;bottom:0;flex-direction:column;align-items:stretch;gap:0;padding:12px 24px 40px;background:var(--hz-bg);color:var(--hz-text);overflow:auto;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s,transform .25s,visibility .25s}
  .nav.open{opacity:1;visibility:visible;transform:none}
  .nav a{font-size:22px;font-weight:600;padding:20px 0;min-height:64px;border-bottom:1px solid var(--hz-line);opacity:1;letter-spacing:-.02em}
  .nav a::after{display:none}
  .nav a.active{color:var(--hz-accent)}
  .nav .nav-cta{margin:28px 0 0;text-align:center;font-size:17px;background:var(--hz-btn-bg);color:var(--hz-btn-text);border:0;padding:18px;min-height:0;border-bottom:0}
  .nav .nav-cta:hover{background:var(--hz-btn-bg);color:var(--hz-btn-text)}
}

/* ---------- ① 메인 화면 ---------- */
.hero{position:relative;background:var(--hz-bg);color:var(--hz-text);font-family:var(--hz-font);padding:calc(var(--header-h) + 56px) 0 0;min-height:min(100svh,900px);display:flex;flex-direction:column;overflow:hidden}
.hero .wrap{max-width:1200px}
.hero .hero-grid{position:relative;flex:1;display:grid;grid-template-columns:minmax(0,55fr) minmax(0,45fr);column-gap:56px;align-items:center;padding-bottom:56px}
.hero-kicker{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:12.5px;font-weight:600;letter-spacing:.2em;color:var(--hz-accent);margin-bottom:28px}
.hero-kicker::before{content:"";width:28px;height:1px;background:currentColor}
.hero h1{font-weight:700;font-size:clamp(32px,3.6vw,44px);line-height:1.36;letter-spacing:-.035em;color:var(--hz-text)}
.hero h1 .line{display:block;white-space:nowrap}
.hero h1 em{font-style:normal;color:var(--hz-accent)}
.hero h1 .m-br{display:none}
.hero-sub{margin-top:28px;font-size:clamp(16.5px,1.35vw,18px);line-height:1.85;color:var(--hz-sub);max-width:30em;letter-spacing:-.01em}
.hero-actions{margin-top:40px;display:flex;flex-wrap:wrap;gap:12px}
.hz-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 28px;border-radius:999px;font-size:16px;font-weight:600;letter-spacing:-.01em;text-decoration:none;border:1px solid transparent;transition:background .25s,color .25s,border-color .25s}
.hz-btn .ico{width:18px;height:18px;stroke-width:2;transition:transform .25s var(--ease)}
.hz-btn-primary{background:var(--hz-btn-bg);color:var(--hz-btn-text)}
.hz-btn-primary:hover .ico{transform:translateX(3px)}
.hz-btn-line{border-color:var(--hz-line);color:var(--hz-text);background:var(--hz-surface)}
.hz-btn-line:hover{border-color:var(--hz-text)}
.hero-more{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:10px 0;font-size:15.5px;font-weight:600;color:var(--hz-text);text-decoration:none;border-bottom:1px solid var(--hz-line);transition:border-color .2s}
.hero-more:hover{border-color:var(--hz-accent)}
.hero-more .ico{width:16px;height:16px;stroke-width:2}

/* 오른쪽: 활동 사진 (라운드 사각형 프레임) */
.hz-visual{justify-self:end;width:100%;max-width:500px;margin:0}
.hz-tags{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.hz-tags li{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;border:1px solid var(--hz-line);background:var(--hz-surface);font-size:13.5px;font-weight:600;color:var(--hz-text);line-height:1.3}
.hz-tags li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--hz-accent)}
.hz-frame{position:relative;aspect-ratio:4/3;border-radius:24px;overflow:hidden;border:1px solid var(--hz-line);background:var(--hz-surface-2);box-shadow:var(--hz-shadow)}
.hz-slides{position:absolute;inset:0;touch-action:pan-y}
.hz-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s var(--ease)}
.hz-slide.on{opacity:1}
.hz-slide.broken{display:none}
.hz-visual.no-photo .hz-cap,.hz-visual.no-photo .hz-dots{display:none}
/* 사진이 없거나 불러오지 못할 때 보이는 타이포그래피 카드 (같은 크기 유지) */
.hz-empty{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,4vw,40px);background:var(--hz-surface-2)}
.hz-empty span{font-size:11.5px;font-weight:600;letter-spacing:.2em;color:var(--hz-sub)}
.hz-empty p{font-size:clamp(28px,3.2vw,40px);font-weight:700;line-height:1.3;letter-spacing:-.04em;color:var(--hz-text)}
.hz-empty p em{font-style:normal;color:var(--hz-accent)}
.hz-cap{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:16px}
.hz-cap-text{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:14px;color:var(--hz-sub);line-height:1.5}
.hz-cap-text b{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--hz-accent)}
.hz-ctrl{display:flex;align-items:center;gap:4px;flex:none}
.hz-arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--hz-line);display:inline-flex;align-items:center;justify-content:center;color:var(--hz-text);background:var(--hz-surface);transition:border-color .2s}
.hz-arrow:hover{border-color:var(--hz-text)}
.hz-arrow .ico{width:18px;height:18px;stroke-width:1.8}
.hz-count{min-width:64px;text-align:center;font-size:12.5px;font-weight:600;letter-spacing:.12em;color:var(--hz-text);font-variant-numeric:tabular-nums}
.hz-dots{display:flex;gap:6px;margin-top:12px}
.hz-dot{position:relative;width:28px;height:24px;padding:0}
.hz-dot::before{content:"";position:absolute;left:0;right:0;top:11px;height:2px;border-radius:2px;background:var(--hz-line);transition:background .3s}
.hz-dot[aria-current="true"]::before{background:var(--hz-accent)}

/* 메인 화면 하단 활동 분야 */
.fields{position:relative}
.fields ul{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hz-line)}
.fields li{padding:22px 24px 26px 0;display:flex;flex-direction:column;gap:6px}
.fields li+li{padding-left:24px;border-left:1px solid var(--hz-line)}
.fields i{font-style:normal;font-size:11.5px;font-weight:600;letter-spacing:.12em;color:var(--hz-accent)}
.fields b{font-weight:600;font-size:16.5px;color:var(--hz-text);letter-spacing:-.02em}
.fields span{font-size:14px;color:var(--hz-sub)}

/* 첫 등장: 한 번만 부드럽게 */
.intro .hero-copy,.intro .hz-visual,.intro .fields{opacity:0;transform:translateY(12px)}
.intro.go .hero-copy,.intro.go .hz-visual,.intro.go .fields{opacity:1;transform:none;transition:opacity .9s var(--ease),transform .9s var(--ease)}
.intro.go .hz-visual{transition-delay:.15s}.intro.go .fields{transition-delay:.3s}

@media (max-width:960px){
  .hero{padding-top:calc(var(--header-h) + 56px);min-height:auto}
  .hero .hero-grid{grid-template-columns:1fr;row-gap:56px;padding-bottom:64px}
  .hero h1{font-size:clamp(30px,6.4vw,46px)}
  .hero h1 .line{white-space:normal}
  .hz-visual{justify-self:start;max-width:560px}
  .fields ul{grid-template-columns:1fr 1fr}
  .fields li:nth-child(3){border-left:0;padding-left:0}
  .fields li:nth-child(n+3){border-top:1px solid var(--hz-line)}
}
@media (max-width:640px){
  .hero{padding-top:calc(var(--header-h) + 40px)}
  .hero-kicker{font-size:11.5px;letter-spacing:.16em;margin-bottom:22px}
  .hero h1{font-size:clamp(29px,8.2vw,36px);line-height:1.4}
  .hero h1 .m-br{display:inline}
  .hero-sub{margin-top:22px}
  .hero-actions{margin-top:32px;flex-direction:column}
  .hz-btn{width:100%;min-height:58px}
  .hz-frame{border-radius:18px}
  .hz-cap{flex-direction:column;align-items:stretch;gap:12px}
  .hz-ctrl{justify-content:space-between;border-top:1px solid var(--hz-line);padding-top:12px}
  .hz-dots{display:none}
  .fields li{padding:22px 12px 24px 0}
  .fields li+li{padding-left:14px}
  .fields li:nth-child(3){padding-left:0}
  .fields b{font-size:15.5px}
  .fields span{font-size:13px}
  .wordmark b{font-size:19px;letter-spacing:-.04em}
}

/* ---------- 섹션 공통 ---------- */
.sec{padding:128px 0}
.sec-alt{background:var(--bg-alt)}
.head{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;margin-bottom:64px;align-items:start}
.head-label{font-size:13.5px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:10px;padding-top:12px}
.head-label::before{content:"";width:20px;height:1px;background:currentColor}
.head h2,.h2{font-weight:700;font-size:clamp(28px,3vw,40px);line-height:1.38;letter-spacing:-.035em;color:var(--heading)}
.head p{margin-top:18px;font-size:17.5px;color:var(--text-muted);max-width:36em}
.reveal{opacity:0;transform:translateY(24px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.reveal.in{opacity:1;transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text-muted)}

/* ---------- ② 소개 ---------- */
.about{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:88px;align-items:start}
.portrait{position:relative;max-width:400px}
.photo{position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border)}
.photo img{width:100%;height:100%;object-fit:cover}
.monogram{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:28px 28px 30px;background:linear-gradient(170deg,var(--surface-2),color-mix(in srgb,var(--accent) 13%,var(--surface-2)))}
.monogram span{font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--text-muted)}
.monogram b{font-size:clamp(84px,9vw,128px);font-weight:700;line-height:.86;letter-spacing:-.05em;color:var(--heading)}
.monogram b i{font-style:normal;color:var(--accent)}
.sign{margin-top:28px;display:flex;flex-direction:column;gap:4px}
.sign strong{font-weight:700;font-size:24px;letter-spacing:-.02em;color:var(--heading)}
.sign span{font-size:14.5px;color:var(--text-muted)}
.about-body .lead{margin-top:32px;padding-left:22px;border-left:2px solid var(--accent);font-size:clamp(19px,1.7vw,22px);line-height:1.7;color:var(--heading);font-weight:500;letter-spacing:-.02em;max-width:30em}
.about-body .paras{margin-top:28px;display:grid;gap:14px;color:var(--text-muted);max-width:36em}
.values{margin-top:52px;list-style:none;display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
.values li{display:grid;grid-template-columns:28px 1fr;column-gap:14px;align-items:start;padding:18px 0;border-top:1px solid var(--border)}
.values .ico{grid-row:span 2;color:var(--accent);width:22px;height:22px;margin-top:2px}
.values b{font-size:16px;color:var(--heading);font-weight:600;line-height:1.5}
.values small{font-size:14.5px;color:var(--text-muted);line-height:1.55}

/* ---------- ③ 강의 프로그램 (비교표) ---------- */
.ptable{border-top:1px solid var(--heading)}
.ptable-head,.prow{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.8fr) minmax(0,1.2fr) 110px;column-gap:32px}
.ptable.has-out .ptable-head,.ptable.has-out .prow{grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr) minmax(0,1.1fr) minmax(0,.9fr) 110px}
.ptable-head{padding:14px 0;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-muted)}
.prow{padding:32px 0;border-bottom:1px solid var(--border);align-items:start;transition:background .3s}
.prow:hover{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.p-main{display:grid;grid-template-columns:48px 1fr;column-gap:18px}
.program-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}
.program-icon .ico{width:21px;height:21px}
.prow h3{font-weight:700;font-size:20px;letter-spacing:-.025em;color:var(--heading);line-height:1.4}
.prow .desc{margin-top:6px;font-size:15.5px;color:var(--text-muted);line-height:1.65}
.p-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.p-for{font-size:15.5px;color:var(--heading);font-weight:500;line-height:1.6}
.p-items{list-style:none;display:grid;gap:6px;font-size:15px;line-height:1.55}
.p-items li{display:flex;gap:10px;align-items:baseline}
.p-items li::before{content:"";flex:none;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translateY(-3px)}
.p-items li.more{color:var(--text-muted)}
.p-items li.more::before{background:var(--border)}
.p-act{justify-self:end}
.p-act .link{white-space:nowrap}

/* 상세 패널 (오른쪽 서랍) */
.drawer{position:fixed;inset:0;z-index:80;visibility:hidden;transition:visibility .5s}
.drawer.open{visibility:visible}
.drawer-dim{position:absolute;inset:0;background:rgba(28,25,22,.5);opacity:0;transition:opacity .45s var(--ease)}
.drawer.open .drawer-dim{opacity:1}
.drawer-box{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);overflow:auto;padding:calc(36px + env(safe-area-inset-top,0px)) 48px calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(100%);transition:transform .55s var(--ease)}
.drawer.open .drawer-box{transform:none}
.drawer-close{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));right:22px;width:46px;height:46px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;color:var(--heading)}
.drawer-close:hover{border-color:var(--heading)}
.d-for{font-size:14px;color:var(--accent);font-weight:600;margin-top:40px}
.drawer-box h3{margin-top:10px;font-weight:700;font-size:30px;line-height:1.3;letter-spacing:-.03em;color:var(--heading)}
.drawer-box .desc{margin-top:16px;color:var(--text-muted);font-size:17px}
.drawer-box h4{margin-top:44px;font-size:14px;color:var(--text-muted);font-weight:500;padding-bottom:12px;border-bottom:1px solid var(--heading)}
.drawer-box ol{list-style:none;counter-reset:c}
.drawer-box ol li{counter-increment:c;display:grid;grid-template-columns:44px 1fr;padding:16px 0;border-bottom:1px solid var(--border);font-size:16.5px}
.drawer-box ol li::before{content:counter(c,decimal-leading-zero);font-family:var(--serif);color:var(--accent);font-weight:500}
.drawer-box dl{display:grid}
.drawer-box dl div{display:grid;grid-template-columns:110px 1fr;padding:14px 0;border-bottom:1px solid var(--border);font-size:15.5px}
.drawer-box dt{color:var(--text-muted)}
.d-actions{margin-top:40px;display:flex;flex-wrap:wrap;gap:10px}

/* ---------- ④ 교육 방식 ---------- */
.dark-sec{position:relative;background:var(--ink);color:var(--on-dark);overflow:hidden}
.dark-sec .wrap{position:relative}
.dark-sec .head h2{color:#fff}
.dark-sec .head p{color:var(--on-dark-muted)}
.dark-sec .head-label{color:var(--teal-lt)}
.m-features{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:80px}
.m-feature{padding:36px 36px 40px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid var(--on-dark-line)}
.m-feature span{font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--teal-lt)}
.m-feature h3{margin-top:14px;font-size:clamp(22px,2.2vw,28px);font-weight:700;color:#fff;letter-spacing:-.03em;line-height:1.35}
.m-feature p{margin-top:10px;color:var(--on-dark-muted);font-size:16.5px;line-height:1.7;max-width:28em}
.m-sub-title{font-size:13.5px;font-weight:600;color:var(--on-dark-muted);margin-bottom:18px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--on-dark-line)}
.step{padding:26px 24px 0 0}
.step+.step{padding-left:24px;border-left:1px solid var(--on-dark-line)}
.step-head{display:flex;align-items:center;gap:10px;color:var(--teal-lt)}
.step-head .ico{width:20px;height:20px}
.step-n{font-size:13px;font-weight:600;letter-spacing:.1em}
.step h3{margin-top:14px;font-size:19px;font-weight:700;color:#fff;letter-spacing:-.02em}
.step p{margin-top:8px;font-size:15px;color:var(--on-dark-muted);line-height:1.65}
.method-foot{margin-top:64px;padding-top:28px;border-top:1px solid var(--on-dark-line);display:grid;grid-template-columns:200px 1fr;gap:40px}
.method-foot span{font-size:13.5px;font-weight:600;color:var(--on-dark-muted)}
.method-foot p{font-size:clamp(18px,1.6vw,21px);line-height:1.7;color:#fff;font-weight:500;letter-spacing:-.02em;max-width:34em}

/* ---------- ⑤ 홈페이지 제작 ---------- */
.web{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:88px;align-items:start}
.web-aside{position:sticky;top:calc(var(--header-h) + 40px)}
.web-aside p{margin-top:20px;font-size:17px;color:var(--text-muted);max-width:26em}
.web-aside .btn{margin-top:32px}
.services{list-style:none;border-top:1px solid var(--heading)}
.services li{display:grid;grid-template-columns:44px 1fr;gap:20px;align-items:center;padding:24px 0;border-bottom:1px solid var(--border)}
.services .s-ico{width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--accent) 10%,transparent);display:grid;place-items:center;color:var(--accent)}
.services .s-ico .ico{width:20px;height:20px}
.services b{display:block;font-weight:700;font-size:18.5px;color:var(--heading);letter-spacing:-.02em;line-height:1.45}
.services small{display:block;margin-top:2px;font-size:15px;color:var(--text-muted);line-height:1.6}
.flow{margin-top:104px}
.flow-title{display:flex;justify-content:space-between;align-items:end;gap:16px 24px;flex-wrap:wrap;margin-bottom:40px}
.flow-title h3{font-weight:700;font-size:clamp(21px,2vw,26px);letter-spacing:-.03em;color:var(--heading)}
.flow-title p{color:var(--text-muted);font-size:15.5px}
.flow ol{position:relative;list-style:none;display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
.flow ol::before{content:"";position:absolute;left:0;right:0;top:7px;height:1px;background:var(--border)}
.flow li{position:relative;padding-top:34px}
.flow li::before{content:"";position:absolute;left:0;top:0;width:15px;height:15px;border-radius:50%;background:var(--bg);border:1.5px solid var(--accent)}
.flow li:last-child::before{background:var(--accent)}
.flow .fn{font-size:12.5px;font-weight:600;letter-spacing:.1em;color:var(--accent)}
.flow b{display:block;margin-top:6px;font-size:17px;color:var(--heading);font-weight:700}
.flow small{display:block;margin-top:6px;font-size:14.5px;color:var(--text-muted);line-height:1.6}

/* ---------- ⑥ 포트폴리오 ---------- */
.notice{display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:15px;color:var(--text-muted);margin-bottom:32px}
.notice .ico{color:var(--accent);width:20px;height:20px;margin-top:3px}
.works{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.work{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:28px;align-items:center;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--border);transition:border-color .3s,box-shadow .3s}
.work:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--border));box-shadow:0 24px 48px -36px rgba(48,43,39,.4)}
.frame{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.frame-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.frame-bar i{width:7px;height:7px;border-radius:50%;background:var(--border)}
.frame-bar span{margin-left:8px;flex:1;height:14px;border-radius:999px;background:var(--surface-2)}
.frame-view{aspect-ratio:4/3;position:relative;overflow:hidden;background:var(--surface-2)}
.frame-view img{width:100%;height:100%;object-fit:cover;object-position:center}
.mock{position:absolute;inset:0;padding:14px;display:grid;grid-template-rows:auto 1fr auto;gap:10px}
.mock-nav{display:flex;justify-content:space-between}.mock-nav i{height:7px;width:22%;border-radius:4px;background:color-mix(in srgb,var(--text) 16%,transparent)}
.mock-nav em{display:flex;gap:6px}.mock-nav em i{width:22px}
.mock-hero{border-radius:8px;background:linear-gradient(120deg,var(--c1),var(--c2));position:relative}
.mock-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mock-row i{height:26px;border-radius:6px;background:color-mix(in srgb,var(--text) 9%,transparent)}
.frame .chip{position:absolute;left:10px;top:10px;font-size:11.5px;padding:3px 9px}
.work-meta{padding:4px 8px 4px 0;display:flex;flex-direction:column;min-width:0}
.work-type{font-size:13px;color:var(--accent);font-weight:600}
.work h3{margin-top:6px;font-weight:700;font-size:20px;color:var(--heading);letter-spacing:-.025em;line-height:1.4}
.work ul{list-style:none;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--text-muted)}
.work li+li::before{content:"/";margin-right:12px;color:var(--border)}
.work .link{margin-top:18px;align-self:flex-start}
.work .link[aria-disabled="true"]{opacity:.45;pointer-events:none;border-bottom-style:dashed}
.empty{padding:72px 24px;text-align:center;border:1px dashed var(--border);border-radius:20px;color:var(--text-muted)}

/* ---------- ⑦ 갤러리 ---------- */
.g-top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:32px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filter{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--border);font-size:15px;font-weight:500;color:var(--text-muted);transition:all .3s}
.filter:hover{color:var(--heading);border-color:var(--heading)}
.filter[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-text);border-color:transparent}
.g-count{font-size:14px;color:var(--text-muted)}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:230px;grid-auto-flow:dense;gap:14px}
.shot{position:relative;border-radius:14px;overflow:hidden;background:var(--surface-2);text-align:left;padding:0}
.shot.big{grid-column:span 2;grid-row:span 2}
.shot.tall{grid-row:span 2}
.shot img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.shot:hover img{transform:scale(1.05)}
.shot.ex{background:#F3EEE6}
.shot.ex img{object-fit:contain}
.ex-badge{position:absolute;left:12px;top:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:#302B27;font-size:12px;font-weight:600;line-height:1.4}
.ph-img{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(150deg,color-mix(in srgb,var(--c1) 26%,var(--surface-2)),color-mix(in srgb,var(--c2) 16%,var(--surface-2)));color:var(--text-muted);font-size:13px}
.ph-img .ico{width:32px;height:32px;stroke-width:1.2;color:var(--c1)}
.shot .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 16px;background:linear-gradient(transparent,rgba(48,43,39,.85));color:#fff;transform:translateY(8px);opacity:0;transition:all .4s var(--ease)}
.shot .cap small{display:block;font-size:12.5px;color:#F0DDD2}
.shot .cap b{font-weight:500;font-size:15px}
.shot:hover .cap,.shot:focus-visible .cap{opacity:1;transform:none}
.g-note{margin-top:22px;font-size:14px;color:var(--text-muted)}

.lightbox{position:fixed;inset:0;z-index:90;background:rgba(28,25,22,.95);display:flex;align-items:center;justify-content:center;padding:calc(72px + env(safe-area-inset-top,0px)) 88px calc(72px + env(safe-area-inset-bottom,0px));opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.lightbox.open{opacity:1;visibility:visible}
.lb-stage{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:18px}
.lb-media{width:100%;aspect-ratio:3/2;max-height:72vh;border-radius:8px;overflow:hidden;position:relative;background:#3A342F}
.lb-media img{width:100%;height:100%;object-fit:contain}
.lb-media .ph-img{color:#D8CCC0;background:linear-gradient(150deg,color-mix(in srgb,var(--c1) 40%,#3A342F),color-mix(in srgb,var(--c2) 30%,#3A342F))}
.lb-media .ph-img .ico{width:52px;height:52px;color:#fff}
.lb-cap{display:flex;justify-content:space-between;gap:16px;color:#fff;font-size:15px}
.lb-cap small{color:#C9BFB4}
.lb-btn{position:absolute;width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.25);color:#fff;display:grid;place-items:center;transition:background .2s}
.lb-btn:hover{background:rgba(255,255,255,.12)}
.lb-close{top:calc(18px + env(safe-area-inset-top,0px));right:18px}
.lb-prev{left:18px;top:50%;transform:translateY(-50%)}
.lb-next{right:18px;top:50%;transform:translateY(-50%)}

/* ---------- ⑧ 문의 ---------- */
.contact{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:88px;align-items:start}
.contact .head-label{color:var(--teal-lt)}
.contact h2{font-weight:700;font-size:clamp(30px,3.4vw,44px);line-height:1.34;letter-spacing:-.035em;color:#fff}
.contact-aside > p{margin-top:22px;color:var(--on-dark-muted);font-size:17px;max-width:24em}
.c-guide{margin-top:44px;padding-top:28px;border-top:1px solid var(--on-dark-line)}
.c-guide h3{font-size:14px;font-weight:600;color:var(--teal-lt);margin-bottom:18px}
.c-guide ol{list-style:none;display:grid;gap:16px;counter-reset:g}
.c-guide li{counter-increment:g;display:grid;grid-template-columns:34px 1fr;font-size:16px;color:#fff;line-height:1.55}
.c-guide li::before{content:counter(g,decimal-leading-zero);font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--teal-lt);padding-top:3px}
.c-guide small{display:block;margin-top:2px;font-size:14px;color:var(--on-dark-muted)}
.c-mail{margin-top:28px;font-size:15.5px;color:var(--on-dark-muted)}
.c-mail a{color:#fff}
.form{background:var(--surface);color:var(--text);border-radius:24px;padding:48px}
.status{display:flex;gap:12px;align-items:flex-start;padding:15px 18px;border-radius:12px;font-size:14.5px;line-height:1.6;margin-bottom:32px;background:color-mix(in srgb,#C98A12 10%,var(--surface));border:1px solid color-mix(in srgb,#C98A12 35%,var(--border))}
.status .ico{color:#B57A0C;width:20px;height:20px;margin-top:2px}
.status.ok{background:color-mix(in srgb,var(--teal) 10%,var(--surface));border-color:color-mix(in srgb,var(--teal) 40%,var(--border))}
.status.ok .ico{color:var(--accent)}
#formResult .status{margin-bottom:24px}
fieldset{border:0}
legend,.field label{display:block;font-size:14.5px;font-weight:600;color:var(--heading);margin-bottom:12px}
.req{color:var(--accent);margin-left:3px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:32px}
.type{position:relative}
.type input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.type span{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;border-radius:12px;border:1px solid var(--border);font-size:15.5px;transition:border-color .25s,background .25s}
.type span::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);transition:border .2s}
.type:hover span{border-color:var(--text-muted)}
.type input:checked + span{border-color:var(--heading);background:color-mix(in srgb,var(--heading) 4%,transparent)}
.type input:checked + span::before{border:5.5px solid var(--accent)}
.type input:focus-visible + span{outline:2px solid var(--accent-2);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.field{margin-bottom:26px}
.field input,.field textarea{width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--border);background:transparent;font-size:17px;border-radius:0;transition:border-color .25s}
.field textarea{min-height:140px;resize:vertical;line-height:1.7}
.field input:focus,.field textarea:focus{outline:none;border-bottom-color:var(--heading);box-shadow:0 1px 0 0 var(--heading)}
.field ::placeholder{color:color-mix(in srgb,var(--text-muted) 70%,transparent)}
.field .err{display:none;margin-top:8px;font-size:14px;color:#C2410C}
.field.invalid input,.field.invalid textarea{border-bottom-color:#C2410C}
.field.invalid .err{display:block}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.form-hint{margin-top:18px;font-size:13.5px;color:var(--text-muted)}
/* 흰 폼 안의 버튼이 어두운 배경용 스타일을 받아 보이지 않던 문제 수정 */
.form .btn-primary{background:var(--btn-bg);color:var(--btn-text)}
.form .btn-line{border-color:var(--border);color:var(--heading);background:transparent}
.form .btn-line:hover{border-color:var(--heading);background:transparent}

.footer{background:var(--ink);color:var(--on-dark-muted);font-size:14px;border-top:1px solid var(--on-dark-line)}
.footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding-top:36px;padding-bottom:36px}
.footer .wordmark{color:#fff}
.footer .wordmark small{color:var(--on-dark-muted)}

/* ---------- 반응형 ---------- */
@media (max-width:1100px){
  .head{grid-template-columns:1fr;gap:12px}
  .head-label{padding-top:0}
  .about,.web,.contact{gap:56px}
  .ptable-head,.prow{grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1.2fr) 100px;column-gap:24px}
  .method-foot{grid-template-columns:1fr;gap:10px}
  .step{padding-right:16px}.step+.step{padding-left:16px}
}
@media (max-width:960px){
  .wrap{padding:0 24px}
  .sec{padding:96px 0}
  .about,.web,.contact{grid-template-columns:1fr}
  .portrait{max-width:360px}
  .web-aside{position:static}
  .ptable-head{display:none}
  .prow,.ptable.has-out .prow{grid-template-columns:1fr;row-gap:16px;padding:28px 0}
  .p-cell{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px}
  .p-label{position:static;width:auto;height:auto;overflow:visible;clip:auto;white-space:normal;font-size:13px;font-weight:600;color:var(--text-muted);padding-top:2px}
  .p-act{justify-self:start}
  .m-features{grid-template-columns:1fr;gap:14px;margin-bottom:56px}
  .steps{grid-template-columns:1fr;border-top:0}
  .step,.step+.step{display:grid;grid-template-columns:84px minmax(0,1fr);column-gap:12px;padding:20px 0;border-left:0;border-top:1px solid var(--on-dark-line)}
  .step-head{align-self:start;padding-top:2px}
  .step h3{margin-top:0}
  .works{grid-template-columns:1fr}
  .flow ol{grid-template-columns:1fr;gap:0}
  .flow ol::before{left:7px;right:auto;top:8px;bottom:8px;width:1px;height:auto}
  .flow li{padding:0 0 28px 36px}
  .flow li:last-child{padding-bottom:0}
  .gallery{grid-template-columns:repeat(3,1fr);grid-auto-rows:200px}
}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding:0 20px}
  .sec{padding:80px 0}
  .head{margin-bottom:44px}
  .values{grid-template-columns:1fr}
  .about-body .lead{padding-left:16px}
  .p-main{grid-template-columns:40px minmax(0,1fr);column-gap:14px}
  .program-icon{width:40px;height:40px}
  .p-cell{grid-template-columns:1fr;gap:4px}
  .m-feature{padding:28px 24px 30px}
  .step,.step+.step{grid-template-columns:64px minmax(0,1fr)}
  .drawer-box{padding-left:24px;padding-right:24px}
  .drawer-box h3{font-size:26px}
  .services li{gap:16px}
  .work{grid-template-columns:1fr;gap:16px;padding:12px}
  .work-meta{padding:0 6px 8px}
  .gallery{grid-template-columns:1fr 1fr;grid-auto-rows:160px;gap:10px}
  .form{padding:32px 22px}
  .types,.row2{grid-template-columns:1fr}
  .row2{gap:0}
  .lightbox{padding-left:12px;padding-right:12px}
  .lb-prev,.lb-next{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:none}
  .lb-prev{left:calc(50% - 64px)}.lb-next{right:calc(50% - 64px)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal,.intro *{opacity:1!important;transform:none!important}
  .track i{transform:none!important}
}
</style>

};
const icon = (n, cls = "") => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ""}</svg>`;
const LOGO = `<svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#3A342F"/><circle cx="12" cy="13" r="3.2" fill="#fff"/><circle cx="24" cy="23" r="4.4" fill="#B4704F"/><path d="M14.4 15.2L21 20.6" stroke="#E3B49C" stroke-width="1.6" stroke-linecap="round"/><circle cx="25" cy="11" r="1.8" fill="#C99A6B"/><path d="M14.8 12.4L23.2 11.2" stroke="rgba(255,255,255,.45)" stroke-width="1.2" stroke-linecap="round"/></svg>`;

/* ---------- 유틸 ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const br = s => esc(s).replace(/\n/g, "<br>");
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const CAT_COLORS = { "홈페이지 디자인 시안":["#9A563A","#302B27"], "생성형 AI 교육":["#B4704F","#C99A6B"], "시니어 디지털 교육":["#C99A6B","#5A4A3F"], "AI 이미지·콘텐츠 제작":["#9A563A","#5A4A3F"], "홈페이지 제작 교육":["#5A4A3F","#B4704F"] };
const Head = (label, id, title, sub) => `
  <div class="head reveal"><span class="head-label">${esc(label)}</span>
    <div><h2 id="${id}">${br(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ""}</div></div>`;

/* =========================================================
   컴포넌트
   ========================================================= */
function Header(s) {
  return `
  <header class="header" id="header">
    <div class="wrap header-inner">
      <a class="wordmark" href="#top" data-target="top" aria-label="${esc(s.name)} 홈으로">
        ${Wordmark(s.brand)}</a>
      <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="nav">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h16M4 16h16"/></svg></button>
      <nav class="nav" id="nav" aria-label="주요 메뉴">
        ${s.nav.map(n => `<a href="#${n.id}" data-target="${n.id}">${esc(n.label)}</a>`).join("")}
        <a class="nav-cta" href="#${s.navCta.id}" data-target="${s.navCta.id}">${esc(s.navCta.label)}</a>
      </nav>
    </div>
  </header>`;
}

const Wordmark = b => `<b>${esc(b.en).replace(/\*(.+?)\*/g, "<i>$1</i>")}</b>${b.sub ? `<small>${esc(b.sub)}</small>` : ""}`;

const heroLine = t => esc(t).replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/\|/g, '<br class="m-br">');

const pad2 = n => String(n).padStart(2, "0");
function HeroVisual(v) {
  const sl = v.slides || [], many = sl.length > 1;
  const emptyCard = `<div class="hz-empty"${sl.length ? ' aria-hidden="true"' : ""}><span>LEARN · CREATE · GROW</span><p>${v.emptyText.split("\n").map(heroLine).join("<br>")}</p></div>`;
  return `
      <figure class="hz-visual" id="heroSlider"${many ? ' role="region" aria-roledescription="슬라이드" aria-label="작업 사진 슬라이드"' : ""}>
        ${(v.tags || []).length ? `<ul class="hz-tags" aria-label="제공 서비스">${v.tags.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
        <div class="hz-frame">
          ${emptyCard}
          ${sl.length ? `<div class="hz-slides">${sl.map((x, i) => `<img class="hz-slide${i ? "" : " on"}" src="${esc(x.image)}" alt="${esc(x.alt)}" aria-hidden="${i ? "true" : "false"}" width="975" height="740"${i ? ' loading="lazy"' : ""}>`).join("")}</div>` : ""}
        </div>
        ${sl.length ? `<figcaption class="hz-cap">
          <span class="hz-cap-text"><b id="hzFig">FIG. 01 — ${esc(v.label)}</b><span id="hzNote">${esc(sl[0].note)}</span></span>
          ${many ? `<span class="hz-ctrl">
            <button type="button" class="hz-arrow" id="hzPrev" aria-label="이전 사진">${icon("left")}</button>
            <span class="hz-count" id="hzCount" aria-live="polite">01 / ${pad2(sl.length)}</span>
            <button type="button" class="hz-arrow" id="hzNext" aria-label="다음 사진">${icon("right")}</button>
          </span>` : ""}
        </figcaption>
        ${many ? `<div class="hz-dots" role="group" aria-label="사진 선택">${sl.map((x, i) => `<button type="button" class="hz-dot" data-slide="${i}" aria-label="${i + 1}번째 사진" aria-current="${i === 0}"></button>`).join("")}</div>` : ""}` : ""}
      </figure>`;
}

function Hero(h) {
  const act = a => `<a class="hz-btn hz-btn-${a.style}" href="#${a.target}" data-target="${a.target}">${esc(a.label)}${a.style === "primary" ? icon("arrow") : ""}</a>`;
  return `
  <section class="hero intro" id="top" aria-labelledby="hero-title">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="hero-kicker">${esc(h.kicker)}</p>
        <h1 id="hero-title">${h.title.map(t => `<span class="line">${heroLine(t)}</span>`).join("")}</h1>
        <p class="hero-sub">${br(h.sub)}</p>
        <div class="hero-actions">${h.actions.map(act).join("")}</div>
        ${h.more ? `<a class="hero-more" href="#${h.more.target}" data-target="${h.more.target}">${esc(h.more.label)}${icon("arrow")}</a>` : ""}
      </div>
      ${HeroVisual(h.visual)}
    </div>
    <div class="fields"><div class="wrap"><ul aria-label="활동 분야">${h.fields.map((f, i) => `<li><i>0${i + 1}</i><b>${esc(f.title)}</b><span>${esc(f.text)}</span></li>`).join("")}</ul></div></div>
  </section>`;
}

function About(a, name) {
  const photo = a.photo ? `<img src="${esc(a.photo)}" alt="${esc(name)} 프로필 사진">`
    : `<div class="monogram" aria-hidden="true"><span>PROFILE</span><b>K<i>H</i></b></div>`;
  return `
  <section class="sec" id="about" aria-labelledby="about-title">
    <div class="wrap about">
      <div class="reveal">
        <div class="portrait"><div class="photo">${photo}</div></div>

function Education(list) {

  return `
  <section class="sec sec-alt" id="education" aria-labelledby="education-title">
    <div class="wrap">
      ${Head("강의 프로그램", "education-title", "대표 강의 프로그램", "학습자의 눈높이와 활용 목적에 맞춘 네 가지 프로그램입니다. 기관과 수강생 상황에 맞춰 구성을 조정할 수 있습니다.")}

        ${list.map(p => `

    <h4>운영 정보</h4>

      </div>
    </article>`;
  return `

function Shot(g, n) {
  const [c1, c2] = CAT_COLORS[g.cat] || ["#B4704F", "#C99A6B"];
  const size = n % 6 === 0 ? "big" : n % 6 === 3 ? "tall" : "";
  const media = g.src ? `<img src="${esc(g.src)}" alt="${esc(g.title)}${g.example ? " 예시 이미지" : ""}" loading="lazy">${g.example ? `<span class="ex-badge">예시 이미지</span>` : ""}` : `<span class="ph-img">${icon("camera")}<span>사진 자리</span></span>`;
  return `<button class="shot ${size}${g.example ? " ex" : ""}" style="--c1:${c1};--c2:${c2}" data-shot="${n}" aria-label="${esc(g.title)} 크게 보기">${media}<span class="cap"><small>${esc(g.cat)}</small><b>${esc(g.title)}</b></span></button>`;
}

        </fieldset>
        <div class="row2">
          <div class="field"><label for="f-name">이름 또는 기관명<span class="req" aria-hidden="true">*</span></label><input id="f-name" name="name" autocomplete="name" placeholder="홍길동 / ○○교육원" required><p class="err">이름 또는 기관명을 입력해 주세요.</p></div>
          <div class="field"><label for="f-email">이메일<span class="req" aria-hidden="true">*</span></label><input id="f-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required><p class="err">회신받을 이메일 주소를 정확히 입력해 주세요.</p></div>
        </div>
        <div class="field"><label for="f-msg">문의 내용<span class="req" aria-hidden="true">*</span></label><textarea id="f-msg" name="message" required placeholder="교육 대상, 희망 일정, 제작하고 싶은 홈페이지 등을 적어 주세요."></textarea><p class="err">문의 내용을 입력해 주세요.</p></div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">${ready ? "문의 보내기" : "입력 내용 확인"}${icon("arrow", "go")}</button>
          <button class="btn btn-line" type="button" id="copyBtn">${icon("copy")}작성 내용 복사</button>
        </div>
        <p class="form-hint">* 표시는 필수 항목입니다.${ready ? "" : " 전송 기능은 별도 연동(문의 접수 서비스 또는 이메일 연결)이 필요합니다."}</p>
      </form>
    </div>
  </section>`;
}

function Footer(s) {
  return `<footer class="footer"><div class="wrap"><a class="wordmark" href="#top" data-target="top" aria-label="${esc(s.name)} 홈으로">${Wordmark(s.brand)}</a><span>© ${new Date().getFullYear()} ${esc(s.name)}. AI와 함께 배우고, 새로운 가능성을 현실로 만듭니다.</span></div></footer>`;
}

function render() {
  $("#app").innerHTML = Header(SITE) + `<main id="main">` +
    Hero(SITE.hero) + About(SITE.about, SITE.name) + Education(SITE.programs) + Method(SITE.method) +
    Web(SITE.web) + Portfolio(SITE) + Gallery(SITE) + Contact(SITE.contact) + `</main>` + Footer(SITE);
}

/* =========================================================
   동작
   ========================================================= */
function goTo(id) {
  const el = id === "top" ? null : document.getElementById(id);
  if (id !== "top" && !el) return;
  const top = el ? el.getBoundingClientRect().top + window.scrollY - ($("#header").offsetHeight - 1) : 0;
  window.scrollTo({ top, behavior: reduceMotion() ? "auto" : "smooth" });
  const f = el ? el.querySelector("h2") : $("#hero-title");
  if (f) { f.setAttribute("tabindex", "-1"); f.focus({ preventScroll: true }); }
}

/* 메인 화면 슬라이드: 5초마다 넘김, 마우스·포커스가 있으면 멈춤, 움직임 줄이기 설정 시 자동 넘김 없음 */
function heroSlider() {
  const root = $("#heroSlider"); if (!root) return;
  /* 사진을 불러오지 못하면 숨겨서, 뒤의 타이포그래피 카드가 보이게 합니다 */
  const imgs = $$(".hz-slide", root);
  const checkAll = () => { if (imgs.length && imgs.every(x => x.classList.contains("broken"))) { root.classList.add("no-photo"); } };
  imgs.forEach(img => { const bad = () => { img.classList.add("broken"); checkAll(); }; if (img.complete && !img.naturalWidth) bad(); else img.addEventListener("error", bad); });
  const slides = imgs, dots = $$(".hz-dot", root), data = SITE.hero.visual.slides, n = slides.length;
  if (n < 2) return;
  let i = 0, timer = null, hold = false;
  const show = (k, dir = 1) => {
    /* 불러오지 못한 사진은 건너뜁니다 */
    for (let t = 0; t < n && slides[(k + n) % n].classList.contains("broken"); t++) k += dir;
    i = (k + n) % n;
    slides.forEach((s, j) => { s.classList.toggle("on", j === i); s.setAttribute("aria-hidden", String(j !== i)); });
    dots.forEach((d, j) => d.setAttribute("aria-current", String(j === i)));
    $("#hzFig").textContent = `FIG. ${pad2(i + 1)} — ${SITE.hero.visual.label}`;
    $("#hzNote").textContent = data[i].note;
    $("#hzCount").textContent = `${pad2(i + 1)} / ${pad2(n)}`;
  };
  const stop = () => { clearInterval(timer); timer = null; };
  const start = () => { stop(); if (!hold && !reduceMotion() && !document.hidden) timer = setInterval(() => { if (root.classList.contains("no-photo")) return stop(); show(i + 1); }, SITE.hero.visual.interval || 5000); };
  $("#hzPrev").addEventListener("click", () => { show(i - 1, -1); start(); });
  $("#hzNext").addEventListener("click", () => { show(i + 1); start(); });
  dots.forEach(d => d.addEventListener("click", () => { show(+d.dataset.slide); start(); }));
  root.addEventListener("mouseenter", () => { hold = true; stop(); });
  root.addEventListener("mouseleave", () => { hold = false; start(); });
  root.addEventListener("focusin", () => { hold = true; stop(); });
  root.addEventListener("focusout", e => { if (!root.contains(e.relatedTarget)) { hold = false; start(); } });
  root.addEventListener("keydown", e => { if (e.key === "ArrowLeft") { show(i - 1, -1); } else if (e.key === "ArrowRight") { show(i + 1); } });
  const area = $(".hz-slides", root); let x0 = null;
  area.addEventListener("pointerdown", e => { x0 = e.clientX; });
  area.addEventListener("pointerup", e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 40) { show(i + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1); start(); } });
  document.addEventListener("visibilitychange", start);
  start();
}

let lastFocus = null;
function openLayer(el) { lastFocus = document.activeElement; el.classList.add("open"); el.setAttribute("aria-hidden", "false"); document.body.classList.add("locked"); setTimeout(() => ($(".drawer-close,[data-lb='close']", el) || el).focus(), 60); }
function closeLayer(el, restore = true) { el.classList.remove("open"); el.setAttribute("aria-hidden", "true"); document.body.classList.remove("locked"); if (restore && lastFocus) lastFocus.focus(); }
function trapFocus(e, el) {
  if (e.key !== "Tab") return;
  const f = $$("button:not([disabled]),a[href],input,textarea", el).filter(x => x.offsetParent !== null);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
}
function selectInquiry(type) {
  const r = $$("#contactForm input[name=type]").find(i => i.value === type);
  if (r) r.checked = true;
  goTo("contact");
  setTimeout(() => $("#f-name").focus({ preventScroll: true }), reduceMotion() ? 0 : 700);
}

let galleryCat = "전체", lbList = [], lbIndex = 0;
function renderGallery() {
  lbList = SITE.gallery.filter(g => galleryCat === "전체" || g.cat === galleryCat);
  $("#galleryGrid").innerHTML = lbList.map(Shot).join("");
  $("#gCount").textContent = `${lbList.length}개 항목`;
}
function showLb(n) {
  lbIndex = (n + lbList.length) % lbList.length;
  const g = lbList[lbIndex], [c1, c2] = CAT_COLORS[g.cat] || ["#B4704F", "#C99A6B"], m = $("#lbMedia");
  m.style.setProperty("--c1", c1); m.style.setProperty("--c2", c2);
  m.innerHTML = g.src ? `<img src="${esc(g.src)}" alt="${esc(g.title)}">` : `<div class="ph-img">${icon("camera")}<span>사진 자리 · 실제 사진으로 교체 예정</span></div>`;
  $("#lbCap").innerHTML = `<span>${esc(g.title)}</span><small>${g.example ? "예시 이미지 · " : ""}${esc(g.cat)} · ${lbIndex + 1} / ${lbList.length}</small>`;
}

const readForm = () => { const f = $("#contactForm"); return { type: f.type.value, name: f.name.value.trim(), email: f.email.value.trim(), message: f.message.value.trim() }; };
function validate() {
  const d = readForm();
  const checks = { "f-name": !!d.name, "f-email": /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email), "f-msg": !!d.message };
  let bad = null;
  Object.entries(checks).forEach(([id, ok]) => { const el = document.getElementById(id); el.closest(".field").classList.toggle("invalid", !ok); el.setAttribute("aria-invalid", String(!ok)); if (!ok && !bad) bad = el; });
  if (bad) bad.focus();
  return !bad;
}
const setResult = (html, ok) => $("#formResult").innerHTML = `<div class="status ${ok ? "ok" : ""}">${icon(ok ? "check" : "info")}<span>${html}</span></div>`;
async function copyForm() {
  const d = readForm();
  const text = `[문의 유형] ${d.type}\n[이름 또는 기관명] ${d.name}\n[이메일] ${d.email}\n[문의 내용]\n${d.message}`;
  try { await navigator.clipboard.writeText(text); setResult("작성 내용을 복사했습니다.", true); }
  catch { setResult("이 환경에서는 자동 복사가 지원되지 않습니다. 입력란의 내용을 직접 선택해 복사해 주세요.", false); }
}

function bind() {
  const header = $("#header"), nav = $("#nav"), menuBtn = $("#menuBtn"), drawer = $("#drawer"), lb = $("#lightbox");
  const setMenu = open => { nav.classList.toggle("open", open); menuBtn.setAttribute("aria-expanded", String(open)); menuBtn.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기"); document.body.classList.toggle("locked", open); header.classList.toggle("menu-open", open); updateHeader(); };
  menuBtn.addEventListener("click", () => setMenu(!nav.classList.contains("open")));

  document.addEventListener("click", e => {
    const t = e.target;
    const go = t.closest("[data-target]");
    if (go) { e.preventDefault(); if (nav.classList.contains("open")) setMenu(false); goTo(go.dataset.target); return; }
    const prog = t.closest("[data-program]");
    if (prog) { $("#drawerBox").innerHTML = ProgramDetail(SITE.programs.find(x => x.id === prog.dataset.program)); $("#drawerBox").scrollTop = 0; openLayer(drawer); return; }
    const inq = t.closest("[data-inquire]");
    if (inq) { if (drawer.classList.contains("open")) closeLayer(drawer, false); selectInquiry(inq.dataset.inquire); return; }
    if (t.closest("[data-close]")) { closeLayer(drawer); return; }
    const f = t.closest(".filter");
    if (f) { galleryCat = f.dataset.cat; $$(".filter").forEach(b => b.setAttribute("aria-pressed", String(b === f))); renderGallery(); return; }
    const shot = t.closest("[data-shot]");
    if (shot) { showLb(+shot.dataset.shot); openLayer(lb); return; }
    const lbb = t.closest("[data-lb]");
    if (lbb) { const a = lbb.dataset.lb; a === "close" ? closeLayer(lb) : showLb(lbIndex + (a === "next" ? 1 : -1)); return; }
    if (t === lb || t.classList.contains("lb-stage")) closeLayer(lb);
  });

  document.addEventListener("keydown", e => {
    if (lb.classList.contains("open")) {
      if (e.key === "Escape") closeLayer(lb); else if (e.key === "ArrowRight") showLb(lbIndex + 1); else if (e.key === "ArrowLeft") showLb(lbIndex - 1);
      trapFocus(e, lb);
    } else if (drawer.classList.contains("open")) { if (e.key === "Escape") closeLayer(drawer); trapFocus(e, drawer); }
    else if (e.key === "Escape" && nav.classList.contains("open")) setMenu(false);
  });

  const form = $("#contactForm");
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (!validate()) { setResult("필수 항목을 확인해 주세요.", false); return; }
    const c = SITE.contact;
    if (!c.endpoint) { setResult("입력 내용은 모두 확인되었습니다. <b>다만 전송 기능이 아직 연결되지 않아 문의는 전달되지 않았습니다.</b> ‘작성 내용 복사’로 내용을 보관해 주세요.", false); return; }
    try {
      const res = await fetch(c.endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(readForm()) });
      if (!res.ok) throw new Error();
      form.reset(); setResult("문의가 접수되었습니다. 확인 후 회신드리겠습니다.", true);
    } catch { setResult("문의를 보내지 못했습니다. 잠시 후 다시 시도해 주세요.", false); }
  });
  form.addEventListener("input", e => { const fl = e.target.closest(".field"); if (fl) fl.classList.remove("invalid"); });
  $("#copyBtn").addEventListener("click", copyForm);

  /* 헤더: 맨 위에서는 배경 없이, 스크롤하면 반투명 아이보리 배경으로 고정 */
  const hero = $(".hero");
  function updateHeader() {
    const atTop = window.scrollY <= 8 && !nav.classList.contains("open");
    header.classList.toggle("scrolled", !atTop);
    document.body.classList.toggle("at-top", atTop);
  }
  updateHeader(); window.addEventListener("scroll", updateHeader, { passive: true }); window.addEventListener("resize", updateHeader);

  const links = $$("#nav a[data-target]");
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(l => l.classList.toggle("active", l.dataset.target === en.target.id && !l.classList.contains("nav-cta"))); }), { rootMargin: "-45% 0px -50% 0px" });
  $$("main > section[id]").forEach(s => io.observe(s));

  const rv = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); rv.unobserve(en.target); } }), { rootMargin: "0px 0px -10% 0px" });
  $$(".reveal, #steps").forEach(el => rv.observe(el));

  requestAnimationFrame(() => requestAnimationFrame(() => hero.classList.add("go")));
  heroSlider();
  const hash = location.hash.replace("#", "");
  if (hash && document.getElementById(hash)) setTimeout(() => goTo(hash), 200);
}

render();
renderGallery();
bind();
</script>
</body>
</html>
